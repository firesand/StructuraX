name: Build & Package StructuraX (Linux, Windows, macOS Apple Silicon)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (x86_64 Portable .tar.gz, .deb & .sh Installer)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux X11/OpenGL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Build Release Binary
        run: cargo build --locked --release --bin structurax
      - name: Verify release binary
        run: target/release/structurax verify
      - name: Build Cross-Distro Linux Packages (.tar.gz, .deb, .sh)
        run: python3 scripts/build_dist_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: structurax-linux-x86_64
          path: dist/linux/*

  build-windows:
    name: Windows (x86_64 .exe, .zip & NSIS Setup Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build & Package Windows Release
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: structurax-windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.exe

  build-macos-arm64:
    name: macOS Apple Silicon (aarch64-apple-darwin .app & .dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build & Package macOS Apple Silicon (.app & .dmg)
        run: bash scripts/package-macos-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: structurax-macos-arm64
          path: |
            dist/macos/*.dmg
            dist/macos/*.tar.gz

